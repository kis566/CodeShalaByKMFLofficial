<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login - CodeShala</title>
    <link href='https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <style>
        @import url("https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap");

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Poppins", sans-serif;
            text-decoration: none;
            list-style: none;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 50%, #16213e 100%);
            padding: 20px;
        }

        .container {
            position: relative;
            width: 850px;
            height: 580px;
            background: rgba(255, 255, 255, 0.03);
            margin: 20px;
            border-radius: 30px;
            box-shadow: 0 0 60px rgba(124, 58, 237, 0.15);
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
        }

        .container h1 {
            font-size: 34px;
            margin: -10px 0;
            background: linear-gradient(135deg, #7c3aed, #06b6d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .container p {
            font-size: 14px;
            margin: 15px 0;
            color: #86868b;
        }

        form {
            width: 100%;
        }

        .form-box {
            position: absolute;
            right: 0;
            width: 50%;
            height: 100%;
            background: rgba(10, 10, 15, 0.9);
            backdrop-filter: blur(20px);
            display: flex;
            align-items: center;
            color: #f5f5f7;
            text-align: center;
            padding: 40px;
            z-index: 1;
            transition: 0.6s ease-in-out 1.2s, visibility 0s 1s;
            border-left: 1px solid rgba(255, 255, 255, 0.05);
        }

        .container.active .form-box {
            right: 50%;
        }

        .form-box.register {
            visibility: hidden;
        }
        .container.active .form-box.register {
            visibility: visible;
        }

        .input-box {
            position: relative;
            margin: 25px 0;
        }

        .input-box input {
            width: 100%;
            padding: 14px 50px 14px 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            outline: none;
            font-size: 15px;
            color: #f5f5f7;
            font-weight: 400;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .input-box input:focus {
            border-color: #7c3aed;
            box-shadow: 0 0 20px rgba(124, 58, 237, 0.2);
            background: rgba(255, 255, 255, 0.08);
        }

        .input-box input::placeholder {
            color: #6e6e73;
            font-weight: 400;
        }

        .input-box i {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 20px;
            color: #7c3aed;
        }

        .forgot-link {
            margin: -10px 0 15px;
            text-align: right;
        }
        .forgot-link a {
            font-size: 13px;
            color: #86868b;
            transition: color 0.3s;
            cursor: pointer;
        }
        .forgot-link a:hover {
            color: #7c3aed;
        }

        .btn {
            width: 100%;
            height: 50px;
            background: linear-gradient(135deg, #7c3aed, #06b6d4);
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(124, 58, 237, 0.3);
            border: none;
            cursor: pointer;
            font-size: 16px;
            color: #fff;
            font-weight: 600;
            transition: all 0.3s ease;
            letter-spacing: 0.5px;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 0 50px rgba(124, 58, 237, 0.5);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .error-msg {
            color: #f43f5e;
            font-size: 13px;
            min-height: 20px;
            margin-top: 8px;
        }

        .success-msg {
            color: #10b981;
            font-size: 13px;
            min-height: 20px;
            margin-top: 8px;
        }

        .divider {
            margin: 20px 0;
            position: relative;
            text-align: center;
        }

        .divider span {
            background: rgba(10, 10, 15, 0.9);
            padding: 0 15px;
            color: #6e6e73;
            font-size: 13px;
            position: relative;
            z-index: 1;
        }

        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
        }

        .social-icons {
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        .social-icons a {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
            color: #fff;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .social-icons a.google-btn {
            border-color: #ea4335;
            background: rgba(234, 67, 53, 0.1);
        }
        .social-icons a.google-btn:hover {
            background: rgba(234, 67, 53, 0.25);
            box-shadow: 0 4px 15px rgba(234, 67, 53, 0.3);
            transform: translateY(-2px);
        }

        .social-icons a.google-btn svg {
            width: 20px;
            height: 20px;
        }

        .back-home {
            margin-top: 20px;
        }

        .back-home a {
            color: #6e6e73;
            font-size: 13px;
            transition: color 0.3s;
        }

        .back-home a:hover {
            color: #7c3aed;
        }

        /* Toggle Box */
        .toggle-box {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .toggle-box::before {
            content: "";
            position: absolute;
            left: -250%;
            width: 300%;
            height: 100%;
            background: linear-gradient(135deg, #7c3aed, #06b6d4);
            border-radius: 150px;
            z-index: 2;
            transition: 1.8s ease-in-out;
        }

        .container.active .toggle-box::before {
            left: 50%;
        }

        .toggle-panel {
            position: absolute;
            width: 50%;
            height: 100%;
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2;
            transition: 0.6s ease-in-out;
            padding: 40px;
            text-align: center;
        }

        .toggle-panel h1 {
            color: #fff !important;
            -webkit-text-fill-color: #fff !important;
            background: none !important;
            font-size: 32px;
            margin-bottom: 10px;
        }

        .toggle-panel p {
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 25px;
        }

        .toggle-panel.toggle-left {
            left: 0;
            transition-delay: 1.2s;
        }
        .container.active .toggle-panel.toggle-left {
            left: -50%;
            transition-delay: 0.6s;
        }

        .toggle-panel.toggle-right {
            right: -50%;
            transition-delay: 0.6s;
        }
        .container.active .toggle-panel.toggle-right {
            right: 0;
            transition-delay: 1.2s;
        }

        .toggle-panel .btn {
            width: 160px;
            height: 46px;
            background: transparent;
            border: 2px solid #fff;
            box-shadow: none;
            font-size: 15px;
            color: #fff;
        }

        .toggle-panel .btn:hover {
            background: rgba(255, 255, 255, 0.1);
            box-shadow: none;
            transform: translateY(-2px);
        }

        /* Responsive */
        @media screen and (max-width: 650px) {
            .container {
                height: calc(100vh - 40px);
                margin: 10px;
            }

            .form-box {
                bottom: 0;
                width: 100%;
                height: 70%;
            }

            .container.active .form-box {
                right: 0;
                bottom: 30%;
            }

            .toggle-box::before {
                left: 0;
                top: -270%;
                width: 100%;
                height: 300%;
                border-radius: 20vw;
            }

            .container.active .toggle-box::before {
                left: 0;
                top: 70%;
            }

            .container.active .toggle-panel.toggle-left {
                left: 0;
                top: -30%;
            }

            .toggle-panel {
                width: 100%;
                height: 30%;
            }
            .toggle-panel.toggle-left {
                top: 0;
            }
            .toggle-panel.toggle-right {
                right: 0;
                bottom: -30%;
            }

            .container.active .toggle-panel.toggle-right {
                bottom: 0;
            }
        }

        @media screen and (max-width: 400px) {
            .form-box {
                padding: 20px;
            }

            .toggle-panel h1 {
                font-size: 26px;
            }

            .container h1 {
                font-size: 28px;
            }

            .container p {
                font-size: 13px;
            }

            .input-box {
                margin: 18px 0;
            }

            .input-box input {
                padding: 12px 45px 12px 16px;
                font-size: 14px;
            }

            .btn {
                height: 46px;
                font-size: 15px;
            }

            .social-icons a {
                padding: 8px 16px;
                font-size: 13px;
            }
        }

        /* Spinner */
        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- LOGIN FORM -->
        <div class="form-box login">
            <form id="loginForm">
                <h1>🎓 Student Login</h1>
                <p>Welcome back! Please login to continue.</p>
                <div class="input-box">
                    <input type="email" id="loginEmail" placeholder="Email" required autocomplete="email">
                    <i class='bx bxs-envelope'></i>
                </div>
                <div class="input-box">
                    <input type="password" id="loginPassword" placeholder="Password" required autocomplete="current-password">
                    <i class='bx bxs-lock-alt'></i>
                </div>
                <div class="forgot-link">
                    <a onclick="forgotPassword()">Forgot Password?</a>
                </div>
                <button type="submit" class="btn" id="loginBtn">Login</button>
                <p class="error-msg" id="loginError"></p>
                <p class="success-msg" id="loginSuccess"></p>
                <div class="divider"><span>or continue with</span></div>
                <div class="social-icons">
                    <a onclick="googleLogin()" class="google-btn">
                        <svg viewBox="0 0 48 48">
                            <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.1 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.3-.4-3.5z"/>
                            <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 18.9 12 24 12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.1 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
                            <path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.3 0-9.7-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/>
                            <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.1 5.7l6.2 5.2C36.9 40 44 35 44 24c0-1.3-.1-2.3-.4-3.5z"/>
                        </svg>
                        Google
                    </a>
                </div>
                <div class="back-home">
                    <a href="main.html">← Back to Home</a>
                </div>
            </form>
        </div>

        <!-- REGISTER FORM -->
        <div class="form-box register">
            <form id="signupForm">
                <h1>📝 Create Account</h1>
                <p>Join CodeShala and start learning!</p>
                <div class="input-box">
                    <input type="text" id="signupName" placeholder="Full Name" required autocomplete="name">
                    <i class='bx bxs-user'></i>
                </div>
                <div class="input-box">
                    <input type="email" id="signupEmail" placeholder="Email" required autocomplete="email">
                    <i class='bx bxs-envelope'></i>
                </div>
                <div class="input-box">
                    <input type="password" id="signupPassword" placeholder="Password (6+ characters)" required autocomplete="new-password" minlength="6">
                    <i class='bx bxs-lock-alt'></i>
                </div>
                <button type="submit" class="btn" id="signupBtn">Register</button>
                <p class="error-msg" id="signupError"></p>
                <p class="success-msg" id="signupSuccess"></p>
                <div class="divider"><span>or continue with</span></div>
                <div class="social-icons">
                    <a onclick="googleLogin()" class="google-btn">
                        <svg viewBox="0 0 48 48">
                            <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.1 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.3-.4-3.5z"/>
                            <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 18.9 12 24 12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.1 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
                            <path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.3 0-9.7-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/>
                            <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.1 5.7l6.2 5.2C36.9 40 44 35 44 24c0-1.3-.1-2.3-.4-3.5z"/>
                        </svg>
                        Google
                    </a>
                </div>
                <div class="back-home">
                    <a href="main.html">← Back to Home</a>
                </div>
            </form>
        </div>

        <!-- TOGGLE BOX (Slide Animation) -->
        <div class="toggle-box">
            <div class="toggle-panel toggle-left">
                <h1>👋 Hello, Student!</h1>
                <p>Don't have an account yet?</p>
                <button class="btn register-btn" type="button">Create Account</button>
            </div>
            <div class="toggle-panel toggle-right">
                <h1>🎓 Welcome Back!</h1>
                <p>Already have an account?</p>
                <button class="btn login-btn" type="button">Sign In</button>
            </div>
        </div>
    </div>

    <!-- ===== Firebase SDK v10 (Modular) ===== -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import {
            getAuth,
            signInWithEmailAndPassword,
            createUserWithEmailAndPassword,
            GoogleAuthProvider,
            signInWithPopup,
            sendPasswordResetEmail,
            updateProfile,
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import {
            getDatabase,
            ref,
            set,
            serverTimestamp
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // ===== FIREBASE CONFIG =====
        const firebaseConfig = {
            apiKey: "AIzaSyCuuUwd7TINIAwlLxg-OYjo7Q-1cBsbU5I",
            authDomain: "codeshalatest.firebaseapp.com",
            databaseURL: "https://codeshalatest-default-rtdb.firebaseio.com",
            projectId: "codeshalatest",
            storageBucket: "codeshalatest.firebasestorage.app",
            messagingSenderId: "63047132068",
            appId: "1:63047132068:web:b5eb1269a25ea412ed5731"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        // ===== ELEMENTS =====
        const loginForm = document.getElementById('loginForm');
        const signupForm = document.getElementById('signupForm');
        const loginBtn = document.getElementById('loginBtn');
        const signupBtn = document.getElementById('signupBtn');
        const loginError = document.getElementById('loginError');
        const loginSuccess = document.getElementById('loginSuccess');
        const signupError = document.getElementById('signupError');
        const signupSuccess = document.getElementById('signupSuccess');

        // ===== HELPER FUNCTIONS =====
        function showError(el, msg) {
            el.textContent = '❌ ' + msg;
            el.style.display = 'block';
        }
        function showSuccess(el, msg) {
            el.textContent = '✅ ' + msg;
            el.style.display = 'block';
        }
        function clearMessages() {
            [loginError, loginSuccess, signupError, signupSuccess].forEach(el => {
                el.textContent = '';
            });
        }

        // ===== ERROR MESSAGES MAP =====
        const errorMessages = {
            'auth/user-not-found': 'No account found. Please sign up.',
            'auth/wrong-password': 'Incorrect password.',
            'auth/invalid-credential': 'Invalid email or password.',
            'auth/email-already-in-use': 'Email already registered. Please login.',
            'auth/invalid-email': 'Invalid email address.',
            'auth/weak-password': 'Password too weak (min 6 characters).',
            'auth/too-many-requests': 'Too many attempts. Try again later.',
            'auth/operation-not-allowed': 'Email/Password login is not enabled in Firebase.',
            'auth/network-request-failed': 'Network error. Check your internet.',
            'auth/popup-closed-by-user': 'Login cancelled.'
        };

        // ===== TOGGLE ANIMATION (Login <-> Register) =====
        const container = document.querySelector('.container');
        document.querySelector('.register-btn').addEventListener('click', () => {
            container.classList.add('active');
            clearMessages();
        });
        document.querySelector('.login-btn').addEventListener('click', () => {
            container.classList.remove('active');
            clearMessages();
        });

        // ===== LOGIN =====
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            clearMessages();

            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;

            loginBtn.disabled = true;
            loginBtn.innerHTML = '<span class="spinner"></span> Logging in...';

            try {
                await signInWithEmailAndPassword(auth, email, password);
                showSuccess(loginSuccess, 'Login successful! Redirecting...');
                setTimeout(() => {
                    window.location.href = 'member-panel.html';
                }, 800);
            } catch (err) {
                showError(loginError, errorMessages[err.code] || err.message);
                loginBtn.disabled = false;
                loginBtn.textContent = 'Login';
            }
        });

        // ===== SIGN UP =====
        signupForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            clearMessages();

            const name = document.getElementById('signupName').value.trim();
            const email = document.getElementById('signupEmail').value.trim();
            const password = document.getElementById('signupPassword').value;

            if (password.length < 6) {
                showError(signupError, 'Password must be 6+ characters');
                return;
            }

            signupBtn.disabled = true;
            signupBtn.innerHTML = '<span class="spinner"></span> Creating...';

            try {
                const cred = await createUserWithEmailAndPassword(auth, email, password);
                await updateProfile(cred.user, { displayName: name });

                // Save user info to Realtime Database
                try {
                    await set(ref(db, 'users/' + cred.user.uid), {
                        name: name,
                        email: email,
                        role: 'student',
                        createdAt: serverTimestamp()
                    });
                } catch (dbErr) {
                    console.warn('DB save failed:', dbErr);
                }

                showSuccess(signupSuccess, 'Account created! Redirecting...');
                setTimeout(() => {
                    window.location.href = 'member-panel.html';
                }, 800);
            } catch (err) {
                showError(signupError, errorMessages[err.code] || err.message);
                signupBtn.disabled = false;
                signupBtn.textContent = 'Register';
            }
        });

        // ===== GOOGLE LOGIN =====
        window.googleLogin = async function () {
            clearMessages();
            const provider = new GoogleAuthProvider();
            try {
                const result = await signInWithPopup(auth, provider);

                // Save user info (only if new)
                try {
                    await set(ref(db, 'users/' + result.user.uid), {
                        name: result.user.displayName || 'User',
                        email: result.user.email,
                        role: 'student',
                        createdAt: serverTimestamp()
                    });
                } catch (dbErr) {
                    console.warn('DB save failed:', dbErr);
                }

                window.location.href = 'member-panel.html';
            } catch (err) {
                if (err.code !== 'auth/popup-closed-by-user') {
                    showError(loginError, errorMessages[err.code] || err.message);
                }
            }
        };

        // ===== FORGOT PASSWORD =====
        window.forgotPassword = async function () {
            clearMessages();
            const email = document.getElementById('loginEmail').value.trim();
            if (!email) {
                showError(loginError, 'Please enter your email first!');
                return;
            }
            try {
                await sendPasswordResetEmail(auth, email);
                showSuccess(loginSuccess, 'Password reset link sent to your email!');
            } catch (err) {
                showError(loginError, errorMessages[err.code] || err.message);
            }
        };

        // ===== AUTO REDIRECT IF ALREADY LOGGED IN =====
        onAuthStateChanged(auth, (user) => {
            if (user) {
                const urlParams = new URLSearchParams(window.location.search);
                const redirect = urlParams.get('redirect') || 'member-panel.html';
                setTimeout(() => {
                    window.location.href = redirect;
                }, 800);
            }
        });
    </script>
</body>
</html>
